services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_only_change_me}
      MYSQL_DATABASE: slstore
      MYSQL_USER: slstore
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_dev}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - slstore_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  slstore_mysql:
